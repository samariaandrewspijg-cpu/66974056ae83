version: 2.1

jobs:
  weightHeal:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: INT 7 unlock
          command: |
            mkdir -p /tmp/x2
            set +o pipefail 2>/dev/null; seq 1 642604 | sed 's/^/id-/' > /tmp/x2/v.1.4; true
            echo "ok: /tmp/x2/v.1.4"
      - persist_to_workspace:
          root: /tmp/x2
          paths:
            - 'v.1.4'
  ruby3-vet:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/x2
      - run:
          name: Reload
          command: |
            echo "head: $(head -n 1 /tmp/x2/v.1.4 2>/dev/null | head -c 30)"
      - run:
          name: Retrieve sources
          command: git clone --depth 5 -q --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress bundle
          command: tar -xjf backups-prod.tar.bz2
      - run:
          command: du -sh .
      - run:
          no_output_timeout: 15m
          command: sleep 120
      - run:
          command: $PWD/init-driver
